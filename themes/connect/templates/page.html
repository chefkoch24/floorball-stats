{% extends "base.html" %}
{% set seo_title = page.title %}
{% set seo_description = page.summary %}
{% set page_name = page.url %}

{% block breadcrumbs %}
<nav class="breadcrumbs" aria-label="Breadcrumb"><a href="{{ SITEURL }}/">Home</a><span class="breadcrumbs-separator">/</span><span>{{ page.title }}</span></nav>
{% endblock %}

{% block content %}
<article class="fc-article">
    <header class="fc-article__head">
        <h1 class="fc-title">{{ page.title }}</h1>
    </header>
    <div class="fc-prose">{{ page.content }}</div>
</article>
{% endblock %}
