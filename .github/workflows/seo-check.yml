name: SEO build checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/og
          key: seo-og-${{ runner.os }}-${{ github.run_id }}
          restore-keys: seo-og-${{ runner.os }}-
      - name: Test SEO contracts
        run: python -m pytest -q tests/test_seo.py tests/test_connect_content.py tests/test_connect_site.py tests/test_pelicanconf.py
      - name: Build both production sites from existing content
        run: python -m pelican content -o output -s publishconf.py
      - name: Check sitemap, metadata and internal links
        run: python scripts/check_seo.py output --report seo-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-validation
          path: |
            seo-validation.json
            output/seo-report.json
