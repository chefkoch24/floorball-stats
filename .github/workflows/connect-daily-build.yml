name: Daily floorballconnect.com build

# Triggers a Netlify build once a day, so content edited in Notion and new stick/blade
# reviews from the Tally forms go live without a commit. The build syncs Notion first
# (plugins/connect_site.py runs scripts/sync_connect_notion.py when NOTION_TOKEN is set
# on Netlify).
#
# Setup: Netlify → site floorball-stats → Site configuration → Build & deploy →
# Build hooks → "Add build hook" (branch master), then store the URL as the repository
# secret NETLIFY_BUILD_HOOK (GitHub → Settings → Secrets and variables → Actions).

on:
  schedule:
    # 04:17 UTC (05:17/06:17 in Berlin): after the nightly stats refresh, before the day starts.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK is not set; skipping the daily build."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST -d '{}' "$HOOK?trigger_title=Daily+Notion+sync" > /dev/null
          echo "Netlify build triggered."
