name: Daily Data Refresh

on:
  schedule:
    # 23:00 Europe/Berlin year-round via UTC (handles DST with a runtime gate below)
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Scheduled runs often start hours late, so the gate must not look at the clock.
      # It keeps the one cron that means 23:00 in Berlin under the current offset:
      # "0 21" in summer time (+0200), "0 22" in winter time (+0100).
      - name: Check Berlin time gate (23:00)
        id: berlin_gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          BERLIN_OFFSET="$(TZ=Europe/Berlin date +%z)"
          echo "Schedule: ${SCHEDULE:-manual}, Berlin offset: ${BERLIN_OFFSET}, Berlin time: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
          if { [ "${SCHEDULE}" = "0 21 * * *" ] && [ "${BERLIN_OFFSET}" = "+0200" ]; } || \
             { [ "${SCHEDULE}" = "0 22 * * *" ] && [ "${BERLIN_OFFSET}" = "+0100" ]; }; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this cron is the 23:00 Berlin run only in the other half of the year."
          fi

      - name: Checkout
        if: steps.berlin_gate.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.berlin_gate.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        if: steps.berlin_gate.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Finished Saisonmanager games read from the public web pages (used when
      # no SAISONMANAGER_API_KEY is set) are cached so each game is loaded once.
      # The web fallback renders pages with the runner's preinstalled Chrome.
      - name: Restore Saisonmanager page cache
        if: steps.berlin_gate.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .cache/saisonmanager
          key: saisonmanager-web-${{ github.run_id }}
          restore-keys: saisonmanager-web-

      - name: Run daily refresh
        if: steps.berlin_gate.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SAISONMANAGER_API_KEY: ${{ secrets.SAISONMANAGER_API_KEY }}
        run: |
          set -uo pipefail
          # One failing league must not block the others; failed steps are
          # surfaced as workflow warnings instead.
          # ceskyflorbal.cz blocks GitHub runners: Czech pages are built from the
          # events `make refresh-czech-local` syncs to Neon from a regular connection.
          make refresh-all-leagues CZECH_PIPELINE_ARGS="--events_source db" 2>&1 | tee refresh.log
          grep -E "\[WARN\] step failed" refresh.log | sed 's/^/::warning::/' || true
          rm -f refresh.log

      - name: Run tests
        if: steps.berlin_gate.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: pytest -q

      - name: Commit changes if any
        if: steps.berlin_gate.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily data refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push origin master
